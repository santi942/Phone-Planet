<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ebyqulenhirnvuaceczp.supabase.co; connect-src 'self' https://ebyqulenhirnvuaceczp.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="../CSS/LOGIN.css">
    <link rel="icon" type="image/x-icon" href="../IMG/ICONO.ico">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../JS/SUPABASE.js"></script>
<script src="../JS/LOGIN.js" defer></script>


    <title>Phone Planet | Iniciar sesión</title>
</head>

<body>
    <div class="container">
        <a class="volver-tienda" href="../index.html">
            <span aria-hidden="true">←</span> Volver a la tienda
        </a>

        <div class="form-container">

            <h1 id="tituloFormulario">Iniciar Sesión</h1>

            <form id="formularioLogin">

                <!-- Nombre: solo aparece al registrarse -->
                <div class="input-box" id="contenedorNombre"
                     style="display: none;">
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Nombre completo"
                        autocomplete="name"
                    >
                </div>

                <!-- Correo electrónico -->
                <div class="input-box">
                    <input
                        type="text"
                        id="correo"
                        placeholder="Código de usuario"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Contraseña -->
                <div class="input-box">
                    <input
                        type="password"
                        id="contrasena"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >
                </div>

                <!-- Opciones -->
                <div class="remember-password" id="opcionesLogin">
                    <label>
                        <input type="checkbox" id="recordarme">
                        Recordarme
                    </label>

                    <a href="#" id="enlaceRecuperar">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <!-- Botón principal -->
                <button class="btn" id="botonEnviar" type="submit">
                    Ingresar
                </button>

               
           

            </form>

            <!-- Mensajes de éxito y error -->
            <p id="mensajeLogin" role="status" aria-live="polite"></p>

        </div>
    </div>

 
</body>
</html>
